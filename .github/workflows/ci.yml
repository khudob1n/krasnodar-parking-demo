name: ci

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go vet ./...
      - run: go test ./...
      # Импорт из сохранённого ответа должен давать ровно закоммиченный снимок.
      - run: |
          go run ./cmd/importer -input ../data/raw/parkingkrd-zones-2026-10-28.json \
            -generated-at "$(jq -r .generated_at ../data/snapshot/parkings.json)"
          git diff --exit-code ../data/snapshot

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: ./gradlew --no-daemon :shared:jvmTest :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
