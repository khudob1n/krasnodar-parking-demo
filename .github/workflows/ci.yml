name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  # Опубликованный на GitHub релиз получает APK, собранный здесь из его тега.
  release:
    types: [published]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go vet ./...
      - run: go test ./...
      # Импорт из сохранённого ответа должен давать ровно закоммиченный снимок.
      - run: |
          go run ./cmd/importer -input ../data/raw/parkingkrd-zones-2026-10-28.json \
            -generated-at "$(jq -r .generated_at ../data/snapshot/parkings.json)"
          git diff --exit-code ../data/snapshot

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Android SDK уже установлен в образе ubuntu-latest (ANDROID_HOME).
      - run: ./gradlew --no-daemon :shared:jvmTest :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/*/*.apk

  release:
    if: github.event_name == 'release'
    needs: [server, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp apk/release/app-release.apk "krasnodar-parking-${TAG}.apk"
          sha256sum "krasnodar-parking-${TAG}.apk" > "krasnodar-parking-${TAG}.apk.sha256"
          gh release upload "$TAG" "krasnodar-parking-${TAG}.apk" "krasnodar-parking-${TAG}.apk.sha256" --clobber
          notes="docs/releases/${TAG}.md"
          if [ -f "$notes" ]; then gh release edit "$TAG" --notes-file "$notes"; fi
